name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: etec
    steps:
      - uses: actions/checkout@v7

      # Olha o fim de linha gravado no índice (coluna i/), não o da cópia de trabalho: pelo .gitattributes
      # o mvnw.cmd sai do checkout em CRLF, mas dentro do repositório tudo é LF. Binários (i/-text) ficam de fora.
      - name: Conferir fim de linha no índice
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          arquivos=$(git -c core.quotePath=false ls-files --eol | awk -F'\t' '$1 ~ /^i\/(crlf|mixed) / { split($1, coluna, " "); print coluna[1] "  " $2 }')
          if [ -n "$arquivos" ]; then
            echo "::error::Há arquivo de texto com CRLF ou fim de linha misto no repositório. Converta para LF (git add --renormalize .) e faça um novo commit."
            echo "$arquivos"
            exit 1
          fi
          echo "Nenhum arquivo de texto com CRLF ou fim de linha misto no índice."

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e testar
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            etec/target/surefire-reports
            etec/target/failsafe-reports
          if-no-files-found: ignore
