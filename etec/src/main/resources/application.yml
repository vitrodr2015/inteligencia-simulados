spring:
  application:
    name: etec
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/etec?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: etec-simulados
    access-token-expiration: 15m
    refresh-token-expiration: 24h

cors:
  # Vazio = sem CORS. Nunca usar '*'.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  admin-bootstrap:
    # Vazio = ainda sem admin. A regra de produção entra na tarefa do admin inicial.
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  imagens:
    hosts-permitidos: ${IMAGENS_HOSTS_PERMITIDOS:localhost}
  rate-limit:
    auth-por-ip-por-minuto: 10
    signin-por-email-por-minuto: 5

# Inerte até a dependência do springdoc existir.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
