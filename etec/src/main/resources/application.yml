spring:
  application:
    name: etec
  web:
    # Mensagens sempre em português, ignorando o Accept-Language do cliente.
    locale: pt-BR
    locale-resolver: fixed
    resources:
      # API sem arquivos estáticos: rota inexistente vira 404 no formato padrão, em qualquer método.
      add-mappings: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/etec?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: etec-simulados
    access-token-expiration: 15m
    refresh-token-expiration: 24h


app:
  cors:
    # Origens de navegador permitidas, separadas por vírgula (http(s)://domínio[:porta], sem barra nem caminho).
    # Vazio = sem CORS. Nunca '*' (a aplicação não sobe). Em produção (perfil prod) só https.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  termos:
    # Versão e endereço dos termos de uso vigentes (D23, D94). Sem valor padrão: faltando, a aplicação não sobe.
    versao: ${TERMOS_VERSAO}
    url: ${TERMOS_URL}
  imagens:
    hosts-permitidos: ${IMAGENS_HOSTS_PERMITIDOS:localhost}
  # Limite de tentativas (429, D128 a D130). Janela fixa, expira sozinha; os contadores ficam no banco (compartilhados
  # entre instâncias). O de signin conta só FALHAS; o de /auth/* conta toda requisição POST (só proteção contra enxurrada).
  rate-limit:
    limpeza-ativa: true
    auth-por-origem:
      limite: 120
      janela: 1m
    signin-email-origem:
      limite: 5
      janela: 15m
    signin-origem:
      limite: 50
      janela: 15m
    # Erros da senha atual na troca de senha, por usuário (Módulo 13B, D139).
    troca-senha-usuario:
      limite: 5
      janela: 15m
  # Política de entitlements (Tarefa 12, D140 a D142). SEM valor padrão no código: ausente ou desconhecida derruba a subida.
  # "stub" libera, para STUDENT e ADMIN, só os recursos que ele conhece no programa ETEC; troque antes de cobrar.
  entitlements:
    politica: stub
  # Limpeza agendada dos refresh tokens vencidos há mais de 1 dia (Módulo 13B, D137).
  sessoes:
    limpeza-ativa: true

# Inerte até a dependência do springdoc existir.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  tomcat:
    # Quanto do corpo AINDA NÃO LIDO o Tomcat descarta depois de responder sem derrubar a conexão (maxSwallowSize). O padrão
    # (2 MB) fazia o cliente perder o 413 da importação já com 3 MB: a conexão caía antes de ele ler a resposta. Com 20 MB o
    # 413 chega para corpos de até 20 MB (o maior lote que passa em todas as regras por item fica abaixo disso); acima, o Tomcat
    # ainda fecha a conexão, de propósito. Vale para todas as rotas.
    max-swallow-size: 20MB
  error:
    # Nenhum detalhe de erro no corpo (D127): sem mensagem, exceção nem pilha, inclusive nas respostas que o container
    # (Tomcat) dá antes da cadeia de segurança. (No Boot 4.2 o campo path é SEMPRE incluído, não há propriedade que o tire.)
    include-message: never
    include-stacktrace: never
    include-exception: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
