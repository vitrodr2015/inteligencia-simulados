spring:
  application:
    name: etec
  web:
    # Mensagens sempre em português, ignorando o Accept-Language do cliente.
    locale: pt-BR
    locale-resolver: fixed
    resources:
      # API sem arquivos estáticos: rota inexistente vira 404 no formato padrão, em qualquer método.
      add-mappings: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/etec?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: etec-simulados
    access-token-expiration: 15m
    refresh-token-expiration: 24h


app:
  cors:
    # Origens de navegador permitidas, separadas por vírgula (http(s)://domínio[:porta], sem barra nem caminho).
    # Vazio = sem CORS. Nunca '*' (a aplicação não sobe). Em produção (perfil prod) só https.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  termos:
    # Versão e endereço dos termos de uso vigentes (D23, D94). Sem valor padrão: faltando, a aplicação não sobe.
    versao: ${TERMOS_VERSAO}
    url: ${TERMOS_URL}
  admin-bootstrap:
    # Vazio = ainda sem admin. A regra de produção entra na tarefa do admin inicial.
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  imagens:
    hosts-permitidos: ${IMAGENS_HOSTS_PERMITIDOS:localhost}
  rate-limit:
    auth-por-ip-por-minuto: 10
    signin-por-email-por-minuto: 5

# Inerte até a dependência do springdoc existir.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
