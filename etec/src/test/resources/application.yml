# Substitui o application.yml principal nos testes (mesmo nome no classpath).
# Valores falsos e óbvios; nada aqui é segredo real.
# Testes rápidos usam H2; o comportamento real do MySQL (collation, CHECK, Flyway) só é provado
# contra MySQL real (Testcontainers, Módulo 7).
spring:
  application:
    name: etec
  web:
    # Mensagens sempre em português, ignorando o Accept-Language do cliente.
    locale: pt-BR
    locale-resolver: fixed
    resources:
      # API sem arquivos estáticos: rota inexistente vira 404 no formato padrão, em qualquer método.
      add-mappings: false
  datasource:
    # Nome único por contexto: vários @SpringBootTest com create-drop não podem compartilhar o mesmo banco.
    url: jdbc:h2:mem:etec_teste_${random.uuid}
    username: usuario-de-teste
    password: senha-de-teste-falsa
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    # O segredo NÃO fica aqui: o SegredoJwtAleatorioInitializer gera um novo a cada execução (spring.factories de teste).
    issuer: etec-simulados
    access-token-expiration: 15m
    refresh-token-expiration: 24h

app:
  termos:
    versao: v1-teste
    url: https://exemplo.invalid/termos
  # Limites ALTOS: os 1000+ testes que passam pelo signin e pelo /auth/* não podem esbarrar no 429 (todos chegam do mesmo
  # endereço de loopback). Os testes DEDICADOS do limite sobem o próprio contexto com os valores que querem provar. A
  # limpeza agendada fica DESLIGADA (o teste chama o método direto, com o relógio de teste). Os valores reais são os do
  # application.yml principal e são guardados por GuardasDeArquivosReaisTest.
  rate-limit:
    limpeza-ativa: false
    auth-por-origem:
      limite: 1000000
      janela: 1m
    signin-email-origem:
      limite: 1000000
      janela: 1m
    signin-origem:
      limite: 1000000
      janela: 1m
    troca-senha-usuario:
      limite: 1000000
      janela: 1m
  # A limpeza agendada dos refresh tokens fica DESLIGADA nos testes (o teste chama o método direto, com o relógio de teste).
  sessoes:
    limpeza-ativa: false

# Swagger desligado por padrão, como em produção; os testes do Swagger ligam por propriedade.
server:
  error:
    # Nenhum detalhe de erro no corpo (D127): sem mensagem, exceção nem pilha, inclusive nas respostas que o container
    # (Tomcat) dá antes da cadeia de segurança. (No Boot 4.2 o campo path é SEMPRE incluído, não há propriedade que o tire.)
    include-message: never
    include-stacktrace: never
    include-exception: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
