# Substitui o application.yml principal nos testes (mesmo nome no classpath).
# Valores falsos e óbvios; nada aqui é segredo real.
# Testes rápidos usam H2; o comportamento real do MySQL (collation, CHECK, Flyway) só é provado
# contra MySQL real (Testcontainers, Módulo 7).
spring:
  application:
    name: etec
  web:
    # Mensagens sempre em português, ignorando o Accept-Language do cliente.
    locale: pt-BR
    locale-resolver: fixed
    resources:
      # API sem arquivos estáticos: rota inexistente vira 404 no formato padrão, em qualquer método.
      add-mappings: false
  datasource:
    # Nome único por contexto: vários @SpringBootTest com create-drop não podem compartilhar o mesmo banco.
    url: jdbc:h2:mem:etec_teste_${random.uuid}
    username: usuario-de-teste
    password: senha-de-teste-falsa
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    secret: segredo-de-teste-falso-nao-e-real-0123456789
    issuer: etec-simulados
    access-token-expiration: 15m
    refresh-token-expiration: 24h

# Swagger desligado por padrão, como em produção; os testes do Swagger ligam por propriedade.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
